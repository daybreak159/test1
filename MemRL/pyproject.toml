[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "eur-memory-rl"
version = "3.2.0"
description = "Event-driven E/U/R memory reinforcement learning"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.10,<3", "transformers>=5.17,<6", "peft>=0.18,<1", "accelerate>=1.10,<2", "safetensors>=0.6", "numpy>=1.26"]
test = ["pytest>=8", "ruff>=0.9"]
serve = ["fastapi>=0.115", "uvicorn>=0.30"]
eval = ["nltk>=3.9", "numpy>=1.26"]

[project.scripts]
eur = "eur_memory_rl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=.test-tmp"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"] # I/J/K/L match the algorithm's published sampling notation.

[tool.ruff.lint.per-file-ignores]
"tests/test_torch_training.py" = ["E402"] # pytest.importorskip must precede torch-dependent imports.
